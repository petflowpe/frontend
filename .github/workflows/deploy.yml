name: Deploy Frontend VPS (PRO)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: true

jobs:
  trigger-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Validar token de deploy
        env:
          BACKEND_DEPLOY_TOKEN: ${{ secrets.BACKEND_DEPLOY_TOKEN }}
        run: |
          if [ -z "$BACKEND_DEPLOY_TOKEN" ]; then
            echo "::error::Falta BACKEND_DEPLOY_TOKEN en este repo."
            echo "Crea un token en GitHub (Settings > Developer settings > Tokens) con acceso a petflowpe/backend"
            echo "y guardalo como secret BACKEND_DEPLOY_TOKEN en petflowpe/frontend."
            exit 1
          fi

      - name: Disparar deploy frontend en backend
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.BACKEND_DEPLOY_TOKEN }}
          repository: petflowpe/backend
          event-type: deploy-frontend
          client-payload: '{"ref":"${{ github.sha }}","source":"frontend-push"}'
